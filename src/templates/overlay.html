<!-- 3-Column Grid Layout (black sidebars for in-game UI dodge) -->
<div class="overlay-3col-grid">
    <!-- Left sidebar (black dodge space) -->
    <div class="sidebar-left"></div>

    <!-- Center content area -->
    <div class="sidebar-content">
        <!-- Overlay Wrapper - Center Column (visible in OBS) -->
        <div class="overlay-wrapper">
            <div class="overlay-title">SELECTION PROTOCOL</div>

            <!-- Command Log (scrolling history) -->
            <div class="content-command-log">
                <div id="command-log-entries">
                    <!-- Command entry template:
                    <div class="cmd-entry [cmd-accepted|cmd-rejected]">
                        <span class="cmd-char">k</span>
                        <span class="cmd-username">viewer123</span>
                    </div>
                    -->
                </div>
            </div>

            <!-- Bottom Row: Pie Chart + Widgets -->
            <div class="content-bottom-row">
                <!-- Pie Chart Area (left) -->
                <div class="pie-area">
                    <div class="overlay-pie-chart">
                        <canvas id="pieChart" width="140" height="140"></canvas>
                        <div class="overlay-timer" id="time-remaining">30s</div>
                    </div>
                </div>

                <!-- Widgets Area (right: view grid + zoom disk) -->
                <div class="widgets-area">
                    <!-- Widgets will be added in subsequent commits -->
                </div>
            </div>

            <!-- Footer Ticker (status/announcements) -->
            <div class="content-footer-ticker">
                <!-- Footer content will be added in subsequent commit -->
            </div>
        </div>
    </div>

    <!-- Right sidebar (black dodge space) -->
    <div class="sidebar-right"></div>
</div>
